<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vérification du courriel — Fabrix</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #F5F0E8;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      background: #FDFAF4;
      border: 1px solid #E8DFD0;
      border-radius: 20px;
      padding: 48px 40px;
      max-width: 420px;
      width: 100%;
      text-align: center;
    }

    .logo-bar {
      font-size: 28px;
      font-weight: 700;
      color: #B85A0F;
      letter-spacing: -0.5px;
      margin-bottom: 32px;
    }

    .icon-wrap {
      width: 72px;
      height: 72px;
      background: rgba(184, 90, 15, 0.1);
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px;
    }

    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid rgba(184, 90, 15, 0.2);
      border-top-color: #B85A0F;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .check-icon {
      display: none;
      font-size: 36px;
    }

    h1 {
      font-size: 20px;
      font-weight: 700;
      color: #1A1A1A;
      margin-bottom: 10px;
    }

    p {
      font-size: 15px;
      color: #5A4A3A;
      line-height: 1.6;
    }

    .fallback {
      display: none;
      margin-top: 28px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #B85A0F;
      color: #fff;
      text-decoration: none;
      font-size: 15px;
      font-weight: 600;
      padding: 14px 28px;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      width: 100%;
      justify-content: center;
      margin-top: 12px;
    }
    .btn:hover { background: #9e4e0d; }
    .btn.secondary {
      background: transparent;
      color: #B85A0F;
      border: 1.5px solid #B85A0F;
      margin-top: 8px;
    }
    .btn.secondary:hover { background: rgba(184,90,15,0.06); }

    .error-msg {
      display: none;
      background: #FEE2E2;
      border: 1px solid #FCA5A5;
      border-radius: 10px;
      padding: 14px 16px;
      font-size: 14px;
      color: #B91C1C;
      margin-top: 20px;
    }

    .footer {
      margin-top: 32px;
      font-size: 12px;
      color: #9A8A7A;
    }
  </style>
</head>
<body>

<div class="card">
  <div class="logo-bar">Fabrix</div>

  <div class="icon-wrap" id="iconWrap">
    <div class="spinner" id="spinner"></div>
    <div class="check-icon" id="checkIcon">✅</div>
  </div>

  <h1 id="titre">Vérification en cours…</h1>
  <p id="desc">Ouverture de l'application Fabrix…</p>

  <div class="fallback" id="fallback">
    <p>Si l'application ne s'ouvre pas automatiquement :</p>
    <a href="#" id="btnOuvrir" class="btn">Ouvrir Fabrix</a>
    <p style="margin-top:16px; font-size:13px; color:#9A8A7A;">
      Vous n'avez pas encore Fabrix ?
    </p>
    <a href="https://apps.apple.com/app/fabrix/id0000000000" class="btn secondary">
      Télécharger sur l'App Store
    </a>
  </div>

  <div class="error-msg" id="errorMsg"></div>

  <div class="footer">Fabrix par Codimpact</div>
</div>

<script>
  const params  = new URLSearchParams(window.location.search);
  const userId  = params.get('userId');
  const secret  = params.get('secret');

  if (!userId || !secret) {
    document.getElementById('titre').textContent   = 'Lien invalide';
    document.getElementById('desc').textContent    = 'Ce lien de vérification est incomplet ou a expiré.';
    document.getElementById('spinner').style.display = 'none';
    const err = document.getElementById('errorMsg');
    err.textContent = 'Paramètres manquants : userId ou secret introuvable dans le lien.';
    err.style.display = 'block';
  } else {
    const deepLink = `fabrix://verifier-email?userId=${encodeURIComponent(userId)}&secret=${encodeURIComponent(secret)}`;
    document.getElementById('btnOuvrir').href = deepLink;

    // Tentative d'ouverture automatique
    window.location.href = deepLink;

    // Après 2,5 s, si l'app n'a pas répondu, afficher le fallback
    setTimeout(() => {
      document.getElementById('titre').textContent = 'Ouvrir Fabrix';
      document.getElementById('desc').textContent  = 'Appuyez sur le bouton ci-dessous pour finaliser la vérification dans l\'application.';
      document.getElementById('fallback').style.display = 'block';
    }, 2500);
  }
</script>

</body>
</html>
