<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vérification du courriel — Fabrix</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #F5F0E8;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      background: #FDFAF4;
      border: 1px solid #E8DFD0;
      border-radius: 20px;
      padding: 48px 40px;
      max-width: 420px;
      width: 100%;
      text-align: center;
    }

    .logo-bar {
      font-size: 28px;
      font-weight: 700;
      color: #B85A0F;
      letter-spacing: -0.5px;
      margin-bottom: 32px;
    }

    .icon-wrap {
      width: 72px; height: 72px;
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px;
      background: rgba(184, 90, 15, 0.1);
    }
    .icon-wrap.succes { background: rgba(39, 174, 96, 0.12); }
    .icon-wrap.erreur { background: rgba(192, 57, 43, 0.1); }

    .spinner {
      width: 36px; height: 36px;
      border: 3px solid rgba(184, 90, 15, 0.2);
      border-top-color: #B85A0F;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .big-icon { font-size: 38px; display: none; }

    h1 { font-size: 20px; font-weight: 700; color: #1A1A1A; margin-bottom: 10px; }
    p  { font-size: 15px; color: #5A4A3A; line-height: 1.6; }

    .actions { display: none; margin-top: 28px; flex-direction: column; gap: 10px; }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: #B85A0F;
      color: #fff;
      text-decoration: none;
      font-size: 15px;
      font-weight: 600;
      padding: 14px 28px;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      width: 100%;
    }
    .btn:hover { background: #9e4e0d; }

    .note {
      margin-top: 8px;
      font-size: 13px;
      color: #9A8A7A;
      line-height: 1.5;
    }

    .footer { margin-top: 32px; font-size: 12px; color: #9A8A7A; }
  </style>
</head>
<body>
<div class="card">
  <div class="logo-bar">Fabrix</div>

  <div class="icon-wrap" id="iconWrap">
    <div class="spinner" id="spinner"></div>
    <div class="big-icon"  id="bigIcon"></div>
  </div>

  <h1 id="titre">Vérification en cours…</h1>
  <p  id="desc">Confirmation de votre adresse courriel…</p>

  <div class="actions" id="actions"></div>

  <div class="footer">Fabrix par Codimpact</div>
</div>

<script>
  const ENDPOINT   = 'https://tor.cloud.appwrite.io/v1';
  const PROJECT_ID = '6a14866c000d73624922';

  const params = new URLSearchParams(window.location.search);
  const userId = params.get('userId');
  const secret = params.get('secret');

  function setSucces() {
    document.getElementById('iconWrap').classList.add('succes');
    document.getElementById('spinner').style.display = 'none';
    const icon = document.getElementById('bigIcon');
    icon.textContent = '✅';
    icon.style.display = 'block';

    document.getElementById('titre').textContent = 'Courriel vérifié !';
    document.getElementById('desc').textContent  =
      'Votre adresse courriel a été confirmée. Vous pouvez maintenant vous connecter à Fabrix.';

    const actions = document.getElementById('actions');
    actions.style.display = 'flex';

    const deepLink =
      'fabrix://verifier-email'
      + '?userId=' + encodeURIComponent(userId)
      + '&secret=' + encodeURIComponent(secret);

    actions.innerHTML =
      '<a href="' + deepLink + '" class="btn">Ouvrir Fabrix sur mon téléphone</a>'
      + '<p class="note">Sur ordinateur, votre compte est vérifié.'
      + ' Ouvrez simplement Fabrix sur votre téléphone pour vous connecter.</p>';

    // Sur mobile, tenter d'ouvrir l'app automatiquement
    if (/android|iphone|ipad|ipod/i.test(navigator.userAgent)) {
      window.location.href = deepLink;
    }
  }

  function setErreur(message) {
    document.getElementById('iconWrap').classList.add('erreur');
    document.getElementById('spinner').style.display = 'none';
    const icon = document.getElementById('bigIcon');
    icon.textContent = '❌';
    icon.style.display = 'block';

    document.getElementById('titre').textContent = 'Lien invalide';
    document.getElementById('desc').textContent  =
      message || 'Ce lien est expiré ou a déjà été utilisé.';

    const actions = document.getElementById('actions');
    actions.style.display = 'flex';
    actions.innerHTML =
      '<p class="note">Connectez-vous à Fabrix pour recevoir un nouveau lien de vérification.</p>';
  }

  async function verifier() {
    if (!userId || !secret) {
      setErreur('Lien incomplet — paramètres manquants.');
      return;
    }

    try {
      // Appel direct à l'API REST Appwrite.
      // Fonctionne depuis n'importe quel navigateur, sans que l'app soit installée.
      const res = await fetch(ENDPOINT + '/account/verifications/email', {
        method:  'PUT',
        headers: {
          'Content-Type':       'application/json',
          'X-Appwrite-Project': PROJECT_ID,
        },
        body: JSON.stringify({ userId: userId, secret: secret }),
      });

      if (res.ok) {
        setSucces();
      } else {
        const data = await res.json().catch(function() { return {}; });
        if (res.status === 401 || (data && data.type === 'user_invalid_token')) {
          setErreur('Ce lien est expiré ou a déjà été utilisé.');
        } else {
          setErreur((data && data.message) ? data.message : 'Erreur ' + res.status);
        }
      }
    } catch (err) {
      setErreur('Erreur réseau. Vérifiez votre connexion et réessayez.');
    }
  }

  verifier();
</script>
</body>
</html>
